name: Deploy SimFleet to Azure

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: simfleet-azure-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      POSTGRES_NAME: ${{ vars.POSTGRES_NAME }}
      LOCATION: ${{ vars.AZURE_LOCATION || 'northcentralus' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Azure deployment settings
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          POSTGRES_NAME: ${{ vars.POSTGRES_NAME }}
        run: |
          missing=0
          check_setting() {
            if [ -z "${2}" ]; then
              echo "Missing GitHub setting: $1"
              missing=1
            fi
          }
          check_setting AZURE_CLIENT_ID "$AZURE_CLIENT_ID"
          check_setting AZURE_TENANT_ID "$AZURE_TENANT_ID"
          check_setting AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
          check_setting POSTGRES_PASSWORD "$POSTGRES_PASSWORD"
          check_setting AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP"
          check_setting ACR_NAME "$ACR_NAME"
          check_setting POSTGRES_NAME "$POSTGRES_NAME"
          if [ "$missing" -ne 0 ]; then
            echo "Configure the missing repository/environment settings before rerunning deploy."
            exit 1
          fi

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group
        shell: bash
        run: |
          if ! az group show --name "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            az group create --name "$AZURE_RESOURCE_GROUP" --location "$LOCATION"
          fi

      - name: Provision Azure infrastructure
        id: infra
        shell: bash
        run: |
          az deployment group create \
            --name "simfleet-${GITHUB_RUN_ID}-base" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/azure/container-apps.bicep \
            --parameters location="$LOCATION" acrName="$ACR_NAME" postgresName="$POSTGRES_NAME" postgresPassword="$POSTGRES_PASSWORD" \
            --query properties.outputs -o json > outputs.json
          cat outputs.json

      - name: Build and push API and worker images
        shell: bash
        run: |
          ACR_SERVER=$(jq -r '.acrLoginServer.value' outputs.json)
          ACR_USERNAME=$(az acr credential show --name "$ACR_NAME" --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show --name "$ACR_NAME" --query 'passwords[0].value' -o tsv)
          echo "::add-mask::$ACR_PASSWORD"
          printf '%s' "$ACR_PASSWORD" | docker login "$ACR_SERVER" --username "$ACR_USERNAME" --password-stdin
          docker build --file pipeline/Dockerfile.api --tag "$ACR_SERVER/simfleet-api:${GITHUB_SHA}" .
          docker build --file pipeline/Dockerfile.worker --tag "$ACR_SERVER/simfleet-worker:${GITHUB_SHA}" .
          docker push "$ACR_SERVER/simfleet-api:${GITHUB_SHA}"
          docker push "$ACR_SERVER/simfleet-worker:${GITHUB_SHA}"

      - name: Read provisioned URLs
        id: urls
        shell: bash
        run: |
          API_URL=$(jq -r '.apiUrl.value' outputs.json)
          DASHBOARD_URL=$(jq -r '.dashboardUrl.value' outputs.json)
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "dashboard_url=$DASHBOARD_URL" >> "$GITHUB_OUTPUT"

      - name: Build and push dashboard
        shell: bash
        run: |
          ACR_SERVER=$(jq -r '.acrLoginServer.value' outputs.json)
          docker build --file frontend/Dockerfile \
            --build-arg "VITE_API_URL=${{ steps.urls.outputs.api_url }}" \
            --tag "$ACR_SERVER/simfleet-dashboard:${GITHUB_SHA}" frontend
          docker push "$ACR_SERVER/simfleet-dashboard:${GITHUB_SHA}"

      - name: Deploy application images
        shell: bash
        run: |
          ACR_SERVER=$(jq -r '.acrLoginServer.value' outputs.json)
          az deployment group create \
            --name "simfleet-${GITHUB_RUN_ID}-apps" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/azure/container-apps.bicep \
            --parameters location="$LOCATION" acrName="$ACR_NAME" postgresName="$POSTGRES_NAME" postgresPassword="$POSTGRES_PASSWORD" \
              apiImage="$ACR_SERVER/simfleet-api:${GITHUB_SHA}" \
              workerImage="$ACR_SERVER/simfleet-worker:${GITHUB_SHA}" \
              dashboardImage="$ACR_SERVER/simfleet-dashboard:${GITHUB_SHA}" \
              dashboardUrl="${{ steps.urls.outputs.dashboard_url }}"

      - name: Print deployment URLs
        run: |
          echo "API: ${{ steps.urls.outputs.api_url }}"
          echo "Dashboard: ${{ steps.urls.outputs.dashboard_url }}"
